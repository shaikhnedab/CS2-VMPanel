services:
  panel:
    # Prebuilt image from GHCR (published by .github/workflows/docker-build.yml).
    # Override the tag with IMAGE_TAG=main, a version (e.g. v2.0.0), or sha-<sha>.
    image: ghcr.io/shaikhnedab/cs2-vmpanel:${IMAGE_TAG:-latest}
    # Building locally instead? Comment the image: line above and uncomment:
    # build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker-friendly overrides (each can also live in .env directly)
      HOSTNAME: ${HOSTNAME:-localhost}
      SERVER_PORT: 3535
      APACHE_PROXY: true # TLS terminates at the reverse proxy
    ports:
      - "${SERVER_PORT:-3535}:3535"
    volumes:
      # Panel configuration (written by the /install wizard on first boot).
      # Create it BEFORE the first start so the bind mount is a file, not a
      # directory:  cp app/config/example_config.json config.json
      - ./config.json:/app/app/config/config.json
