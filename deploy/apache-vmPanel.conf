# CS2-VMPanel — Apache reverse proxy (TLS terminates here)
# Enable modules first:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
# The panel MUST run with APACHE_PROXY=true so cookies/sessions are secure
# behind the proxy (see .env / docker-compose.yml).

<VirtualHost *:80>
  ServerName vip.example.com
  # Redirect all HTTP to HTTPS.
  RewriteEngine On
  RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName vip.example.com

  # SSLEngine on
  # SSLCertificateFile      /etc/letsencrypt/live/vip.example.com/fullchain.pem
  # SSLCertificateKeyFile   /etc/letsencrypt/live/vip.example.com/privkey.pem

  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  # Brute-force protection on the admin login form
  # (requires mod_ratelimit or mod_qos for true rate limiting;
  #  at minimum, monitor access logs for POST /adminlogin bursts).
  <Location /adminlogin>
    ProxyPass http://127.0.0.1:3535/adminlogin
    ProxyPassReverse http://127.0.0.1:3535/adminlogin
  </Location>

  <Location />
    ProxyPass http://127.0.0.1:3535/
    ProxyPassReverse http://127.0.0.1:3535/
  </Location>
</VirtualHost>
