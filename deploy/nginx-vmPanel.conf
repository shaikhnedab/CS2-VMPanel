# CS2-VMPanel — nginx reverse proxy (TLS terminates here)
# Prerequisites: DNS A record pointing at this host, then:
#   sudo certbot --nginx -d vip.example.com
# The panel MUST run with APACHE_PROXY=true so cookies/sessions are secure
# behind the proxy (see .env / docker-compose.yml).

limit_req_zone $binary_remote_addr zone=vmpanel_login:10m rate=10r/m;

upstream vmpanel {
  server 127.0.0.1:3535;
  keepalive 16;
}

server {
  listen 80;
  server_name vip.example.com;
  # Redirect all HTTP to HTTPS (certbot manages the certificate blocks).
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name vip.example.com;

  # ssl_certificate     /etc/letsencrypt/live/vip.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/vip.example.com/privkey.pem;
  # (managed by certbot — uncomment if writing certificates manually)
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 2m;

  # Brute-force protection on the admin login form.
  location = /adminlogin {
    limit_req zone=vmpanel_login burst=5 nodelay;
    proxy_pass http://vmpanel;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://vmpanel;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
